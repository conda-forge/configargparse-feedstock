# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.0"
  python_check_max: "3.14"

package:
  name: configargparse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/configargparse/configargparse-${{ version }}.tar.gz
  sha256: 48d9c22affe4ac419b4dd0691fa929d759e1f99574be41826785f2dbf3da63a5

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - toml

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/configargparse/**
        - site-packages/configargparse.py
      site_packages:
        - configargparse-${{ version }}.dist-info/**
  - python:
      imports: configargparse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
    requirements:
      run:
        - pytest-cov
        - pyyaml
        - python ${{ python_min }}.*
    script:
      - coverage run --source configargparse --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=84

about:
  license: MIT
  summary: A drop-in replacement for argparse that allows options to also be set via config files and/or environment variables.
  license_file: LICENSE
  homepage: https://pypi.org/project/configargparse
  repository: https://github.com/bw2/ConfigArgParse

extra:
  recipe-maintainers:
    - msarahan
    - bollwyvl
